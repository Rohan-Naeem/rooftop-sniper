<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background glow & gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0f3d" />
      <stop offset="55%" stop-color="#120826" />
      <stop offset="100%" stop-color="#090414" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc533" />
      <stop offset="50%" stop-color="#ff4d8d" />
      <stop offset="100%" stop-color="#3be0e8" />
    </linearGradient>

    <!-- Gold Sack Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="100%" stop-color="#e5a912" />
    </linearGradient>

    <!-- Shadow filter for crisp pop -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Circular Badge Backdrop -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" />
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#rimGrad)" stroke-width="3.5" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- City Skyline Silhouette behind thief -->
  <g fill="#241442" opacity="0.7">
    <rect x="18" y="52" width="14" height="40" />
    <rect x="22" y="44" width="6" height="8" />
    <rect x="96" y="50" width="14" height="42" />
    <rect x="99" y="42" width="8" height="8" />
    <circle cx="106" cy="30" r="8" fill="#ffd98a" opacity="0.3" />
  </g>

  <!-- Group for Thief Character with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Striped Shirt / Body -->
    <path d="M 24 116 C 24 96 36 86 64 86 C 92 86 104 96 104 116 Z" fill="#f4f5f7" />
    <!-- Black Stripes on Shirt -->
    <path d="M 25 94 C 34 89 50 88 64 88 C 78 88 94 89 103 94 L 103 99 C 93 94 77 93 64 93 C 51 93 35 94 25 99 Z" fill="#181a20" />
    <path d="M 24 104 C 34 100 50 99 64 99 C 78 99 94 100 104 104 L 104 109 C 94 105 78 104 64 104 C 50 104 34 105 24 109 Z" fill="#181a20" />
    <path d="M 24 114 C 34 111 50 110 64 110 C 78 110 94 111 104 114 L 104 118 C 94 115 78 114 64 114 C 50 114 34 115 24 118 Z" fill="#181a20" />

    <!-- Neck -->
    <path d="M 54 78 L 74 78 L 72 88 L 56 88 Z" fill="#d2966c" />

    <!-- Head Base (Skin Tone) -->
    <ellipse cx="64" cy="62" rx="25" ry="26" fill="#e4b08a" />
    <!-- Ears -->
    <circle cx="39" cy="63" r="6" fill="#d2966c" />
    <circle cx="39" cy="63" r="3.5" fill="#c08257" />
    <circle cx="89" cy="63" r="6" fill="#d2966c" />
    <circle cx="89" cy="63" r="3.5" fill="#c08257" />

    <!-- Burglar Mask -->
    <path d="M 39 53 C 46 51 55 53 64 56 C 73 53 82 51 89 53 C 92 56 92 65 88 69 C 79 73 70 70 64 66 C 58 70 49 73 40 69 C 36 65 36 56 39 53 Z" fill="#16181f" stroke="#0e1014" stroke-width="1.5" />

    <!-- Mask Eye Openings (White Sclera) -->
    <!-- Left Eye (Sneaky angled) -->
    <path d="M 46 59 C 50 56 56 57 58 61 C 55 64 49 64 46 59 Z" fill="#ffffff" />
    <!-- Right Eye (Sneaky angled) -->
    <path d="M 82 59 C 78 56 72 57 70 61 C 73 64 79 64 82 59 Z" fill="#ffffff" />

    <!-- Pupils (Looking mischievously sideways) -->
    <ellipse cx="54" cy="60" rx="3" ry="3.5" fill="#111317" />
    <circle cx="53" cy="59" r="1.2" fill="#ffffff" />
    <ellipse cx="74" cy="60" rx="3" ry="3.5" fill="#111317" />
    <circle cx="73" cy="59" r="1.2" fill="#ffffff" />

    <!-- Nose -->
    <path d="M 64 66 C 65 69 67 72 65 74 C 63 74 61 73 61 71" fill="none" stroke="#ba7c52" stroke-width="2" stroke-linecap="round" />

    <!-- Smirk / Grin -->
    <path d="M 55 77 C 61 82 71 81 74 76" fill="none" stroke="#68341e" stroke-width="2.6" stroke-linecap="round" />

    <!-- Knit Beanie / Burglar Hat -->
    <path d="M 38 52 C 38 32 46 22 64 22 C 82 22 90 32 90 52 C 84 49 74 48 64 48 C 54 48 44 49 38 52 Z" fill="#1e222b" />
    <!-- Beanie Ribbed Cuff -->
    <path d="M 37 53 C 45 49 55 48 64 48 C 73 48 83 49 91 53 L 91 57 C 83 53 73 52 64 52 C 55 52 45 53 37 57 Z" fill="#2c3240" stroke="#16181f" stroke-width="1" />
    <!-- Beanie Top Seam / Texture -->
    <path d="M 64 22 C 63 32 63 42 64 48" stroke="#2c3240" stroke-width="1.8" stroke-dasharray="2 3" fill="none" />
    <path d="M 52 26 C 54 34 56 42 58 48" stroke="#2c3240" stroke-width="1.5" stroke-dasharray="2 3" fill="none" />
    <path d="M 76 26 C 74 34 72 42 70 48" stroke="#2c3240" stroke-width="1.5" stroke-dasharray="2 3" fill="none" />
  </g>

  <!-- Loot / Money Sack in bottom foreground -->
  <g filter="url(#dropShadow)" transform="translate(78, 76)">
    <!-- Sack Tie -->
    <path d="M 17 6 C 14 3 14 0 17 -3 C 20 -1 22 2 20 6 Z" fill="#875827" />
    <path d="M 19 4 L 14 7" stroke="#ffd98a" stroke-width="1.5" />
    <!-- Sack Body -->
    <path d="M 8 10 C 2 12 0 18 0 25 C 0 34 8 40 18 40 C 28 40 36 34 36 25 C 36 17 32 11 26 10 C 22 9 12 9 8 10 Z" fill="#9c6933" stroke="#5a3715" stroke-width="1.5" />
    <!-- Sack Highlight -->
    <path d="M 8 14 C 4 18 4 25 6 30" fill="none" stroke="#b88349" stroke-width="2" stroke-linecap="round" />
    <!-- Dollar Sign '$' -->
    <text x="18" y="29" font-family="'Nunito','Arial Black',sans-serif" font-weight="900" font-size="16" fill="url(#goldGrad)" text-anchor="middle" stroke="#5c3f0b" stroke-width="0.8">$</text>
  </g>

  <!-- Sniper Crosshair Reticle / Red Laser Target Hint -->
  <circle cx="64" cy="62" r="3" fill="#ff3b47" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="64" cy="62" r="7" fill="none" stroke="#ff3b47" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 2" />
</svg>
