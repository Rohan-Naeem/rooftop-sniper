<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241042" />
      <stop offset="50%" stop-color="#140829" />
      <stop offset="100%" stop-color="#090314" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="40%" stop-color="#ffc533" />
      <stop offset="70%" stop-color="#c98200" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>

    <linearGradient id="badgeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13092b" />
      <stop offset="35%" stop-color="#4d1656" />
      <stop offset="70%" stop-color="#cf316a" />
      <stop offset="100%" stop-color="#ff9c38" />
    </linearGradient>

    <linearGradient id="textGradGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fff2d6" />
      <stop offset="100%" stop-color="#ffca42" />
    </linearGradient>

    <linearGradient id="textGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4df3ff" />
      <stop offset="100%" stop-color="#22b8d1" />
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Background Shield / Circle -->
  <g filter="url(#badgeShadow)">
    <circle cx="200" cy="200" r="185" fill="url(#badgeBg)" stroke="url(#badgeGold)" stroke-width="6" />
    <circle cx="200" cy="200" r="176" fill="none" stroke="#3be0e8" stroke-width="1.8" opacity="0.8" />
  </g>

  <!-- Tactical Scope Outer Ring -->
  <circle cx="200" cy="165" r="115" fill="#0c051a" stroke="url(#badgeGold)" stroke-width="4" />
  
  <!-- Sunset Skyline Inside Scope -->
  <g clip-path="url(#badgeScopeClip)">
    <clipPath id="badgeScopeClip">
      <circle cx="200" cy="165" r="111" />
    </clipPath>

    <rect x="80" y="45" width="240" height="240" fill="url(#badgeSky)" />
    
    <!-- Glowing Sun -->
    <circle cx="200" cy="140" r="32" fill="#ffd982" opacity="0.9" />
    <circle cx="200" cy="140" r="48" fill="#ff7043" opacity="0.3" />

    <!-- Distant Buildings -->
    <g fill="#331045">
      <rect x="100" y="160" width="28" height="90" />
      <rect x="135" y="145" width="32" height="105" />
      <rect x="175" y="125" width="46" height="125" />
      <rect x="230" y="150" width="30" height="100" />
      <rect x="268" y="165" width="28" height="85" />
    </g>

    <!-- Foreground Rooftops (Dark Purple-Black) -->
    <g fill="#140624">
      <rect x="90" y="185" width="45" height="75" />
      <rect x="140" y="170" width="45" height="90" />
      <line x1="162" y1="148" x2="162" y2="170" stroke="#140624" stroke-width="3" />
      <circle cx="162" cy="146" r="2.5" fill="#ff3b47" />

      <rect x="190" y="180" width="55" height="80" />
      <!-- Water tower -->
      <rect x="205" y="166" width="20" height="14" rx="3" fill="#140624" />

      <rect x="250" y="190" width="55" height="70" />
    </g>

    <!-- Lit Windows -->
    <g fill="#ffe073" opacity="0.9">
      <rect x="100" y="200" width="6" height="8" />
      <rect x="115" y="200" width="6" height="8" />
      <rect x="150" y="185" width="7" height="9" />
      <rect x="165" y="185" width="7" height="9" />
      <rect x="205" y="195" width="7" height="9" />
      <rect x="225" y="195" width="7" height="9" />
      <rect x="265" y="205" width="6" height="8" />
    </g>
  </g>

  <!-- Crosshair Reticle -->
  <line x1="95" y1="165" x2="175" y2="165" stroke="#3be0e8" stroke-width="3" opacity="0.9" />
  <line x1="225" y1="165" x2="305" y2="165" stroke="#3be0e8" stroke-width="3" opacity="0.9" />
  <line x1="200" y1="60" x2="200" y2="140" stroke="#3be0e8" stroke-width="3" opacity="0.9" />
  <line x1="200" y1="190" x2="200" y2="270" stroke="#3be0e8" stroke-width="3" opacity="0.9" />

  <!-- Center Target Circle -->
  <circle cx="200" cy="165" r="20" fill="none" stroke="#3be0e8" stroke-width="2.5" opacity="0.9" />
  <circle cx="200" cy="165" r="6" fill="#ff3344" filter="url(#dotGlow)" />
  <circle cx="200" cy="165" r="2" fill="#ffffff" />

  <!-- Banner Plate Behind Typography -->
  <g filter="url(#badgeShadow)">
    <polygon points="40,310 360,310 345,375 55,375" fill="#140826" stroke="url(#badgeGold)" stroke-width="3" />
  </g>

  <!-- Text 'ROOFTOP' -->
  <text x="200" y="302" font-family="'Bungee', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#751642" text-anchor="middle" letter-spacing="0.04em">ROOFTOP</text>
  <text x="200" y="299" font-family="'Bungee', 'Impact', sans-serif" font-size="44" font-weight="900" fill="url(#textGradGold)" stroke="#1a072b" stroke-width="1.8" text-anchor="middle" letter-spacing="0.04em">ROOFTOP</text>

  <!-- Text 'SNIPER' -->
  <text x="200" y="348" font-family="'Bungee', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#0d4052" text-anchor="middle" letter-spacing="0.2em">SNIPER</text>
  <text x="200" y="346" font-family="'Bungee', 'Impact', sans-serif" font-size="34" font-weight="900" fill="url(#textGradCyan)" stroke="#061f26" stroke-width="1.5" text-anchor="middle" letter-spacing="0.2em">SNIPER</text>

  <!-- Stars -->
  <polygon points="68,340 71,348 80,348 73,353 75,361 68,356 61,361 63,353 56,348 65,348" fill="#ffc533" />
  <polygon points="332,340 335,348 344,348 337,353 339,361 332,356 325,361 327,353 320,348 329,348" fill="#ffc533" />
</svg>
